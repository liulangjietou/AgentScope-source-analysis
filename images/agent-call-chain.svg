</a>
<text x="898" y="1314" font-size="15" fill="#b1c2d7" font-weight="400">失败先存已确认安全状态，原样抛原异常</text>
<text x="898" y="1338" font-size="15" fill="#b1c2d7" font-weight="400">用户中断补齐悬空工具错误结果再保存</text>
<text x="898" y="1362" font-size="15" fill="#b1c2d7" font-weight="400">停机中断标记 shutdownInterrupted 防重入</text>
<text x="898" y="1386" font-size="15" fill="#b1c2d7" font-weight="400">订阅取消进入 releaseCallExecution 清理</text>

