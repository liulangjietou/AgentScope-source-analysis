<!-- Layer 04 -->
<rect x="34" y="1028" width="1252" height="422" rx="15" fill="#101b2d" stroke="#2a3a51"/>
<text x="56" y="1061" font-size="21" fill="#cfe2ff" font-weight="600">04  CallExecution：宿主边界、推理、行动与暂停出口</text>
<text x="56" y="1087" font-size="15" fill="#99adc7" font-weight="400">doCallInner 先检查延迟模型答案（#4218）与 pending 工具 / HITL 确认 / 外部结果，再进入推理或恢复行动；全程同步通知 ON_AGENT_EVENT。</text>

<rect x="56" y="1108" width="591" height="128" rx="10" fill="#16243a" stroke="#324967"/>
<a xlink:href="https://github.com/agentscope-ai/agentscope-java/blob/80926f92df182d258118456ae458043af0d7e807/agentscope-core/src/main/java/io/agentscope/core/ReActAgent.java#L3340" target="_blank">
