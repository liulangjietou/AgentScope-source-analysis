</a>
<text x="486" y="1314" font-size="15" fill="#b1c2d7" font-weight="400">PERMISSION_ASKING：等待人工审批回传</text>
<text x="486" y="1338" font-size="15" fill="#b1c2d7" font-weight="400">TOOL_SUSPENDED：外部工具挂起待结果</text>
<text x="486" y="1362" font-size="15" fill="#b1c2d7" font-weight="400">HOST_PAUSED：AgentExecutionHost 边界挂起</text>
<text x="486" y="1386" font-size="15" fill="#b1c2d7" font-weight="400">TOOL_RETURN_DIRECT：工具结果直达用户</text>

