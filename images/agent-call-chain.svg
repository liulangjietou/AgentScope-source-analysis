</a>
<text x="74" y="1162" font-size="15" fill="#b1c2d7" font-weight="400">REASONING 边界 → ON_REASONING → ON_MODEL_CALL（含检索）</text>
<text x="74" y="1186" font-size="15" fill="#b1c2d7" font-weight="400">hostBoundary(MODEL) → ModelRequestPreparer（Harness 驱逐/压缩/预算）</text>
<text x="74" y="1210" font-size="15" fill="#b1c2d7" font-weight="400">untilInterrupted（Flux#handle 同步判中断 #4088）· 空回复注入提醒</text>

<rect x="672" y="1108" width="591" height="128" rx="10" fill="#16243a" stroke="#324967"/>
<a xlink:href="https://github.com/agentscope-ai/agentscope-java/blob/80926f92df182d258118456ae458043af0d7e807/agentscope-core/src/main/java/io/agentscope/core/ReActAgent.java#L4043" target="_blank">
  <text x="690" y="1136" font-size="18" fill="#e6bd72" font-weight="600">acting → partitionByGrant → runToolBatch</text>
</a>
<text x="690" y="1162" font-size="15" fill="#b1c2d7" font-weight="400">hostBoundary(ACTING) → 坏参数隔离（malformedArguments 禁入执行）</text>
<text x="690" y="1186" font-size="15" fill="#b1c2d7" font-weight="400">CapabilitySurface 授权裁剪先于 PermissionEngine（防越权确认弹窗）</text>
<text x="690" y="1210" font-size="15" fill="#b1c2d7" font-weight="400">HITL 先落盘 ASKING 再发确认事件（#3699）· ToolExecutor 分区并发执行</text>

