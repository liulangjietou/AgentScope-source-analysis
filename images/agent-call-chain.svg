<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1320 1890" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="title">AgentScope Java 2.1.0-SNAPSHOT：agent.call 与 streamEvents 五层调用链</title>
<desc id="desc">基线 main 80926f92df182d258118456ae458043af0d7e807。公共入口共享 buildAgentStream 核心；四级身份与入口模型解析后经 onAgent 链进入 AgentBase 生命周期；按 Thread 串行准入后获取 ThreadJournal（含 2.0 基线自动导入）或 standalone 状态，解析 CapabilitySurface 授权面；ReAct 推理、宿主恢复边界、授权/权限门与工具派发；onAgentFinish 收尾、双轨状态保存、释放租约与最终事件输出。点击蓝色/绿色/金色标题可直达固定 SHA 源码声明行。</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 0L8 4L0 8Z" fill="#7389a5"/>
  </marker>
</defs>
<rect width="1320" height="1890" rx="18" fill="#0b1220"/>

<text x="38" y="50" font-size="30" fill="#f1f6ff" font-weight="700">agent.call / streamEvents</text>
<text x="38" y="84" font-size="19" fill="#99adc7" font-weight="400">从公共入口、ThreadJournal 租约、授权裁剪到资源释放 · 五层源码调用全景图</text>
<text x="890" y="46" font-size="17" fill="#72b6ff" font-weight="600">AgentScope Java 2.1.0-SNAPSHOT</text>
<text x="890" y="73" font-size="15" fill="#99adc7" font-weight="400">main 80926f92 · 2026-11-27 核对</text>
<text x="38" y="118" font-size="15" fill="#99adc7" font-weight="400">实线表示必经主干流；虚线表示模式/条件分流。各卡片标题均绑定完整 SHA 源码行号，点击即可跳转。</text>

