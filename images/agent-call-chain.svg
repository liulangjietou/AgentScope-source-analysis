</a>
<text x="690" y="1748" font-size="15" fill="#b1c2d7" font-weight="400">资源释放完成后向外发送 AgentResultEvent（携带终态 Msg）</text>
<text x="690" y="1772" font-size="15" fill="#b1c2d7" font-weight="400">doFinally 发出 AgentEndEvent 并关闭流；错误沿 onError 通道传播</text>

