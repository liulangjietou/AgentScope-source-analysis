<text x="74" y="1748" font-size="15" fill="#b1c2d7" font-weight="400">成功结果先执行 ON_AGENT_FINISH 异步中间件链（仍在活跃上下文内）</text>
<text x="74" y="1772" font-size="15" fill="#b1c2d7" font-weight="400">recorder.finish 写 run/end 并释放 writer；取消时等待 closeStateWrites（#3924）</text>

