<path d="M672 1202 L649 1202" stroke="#7389a5" fill="none" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="56" y="1260" width="385" height="164" rx="10" fill="#16243a" stroke="#324967"/>
<a xlink:href="https://github.com/agentscope-ai/agentscope-java/blob/80926f92df182d258118456ae458043af0d7e807/agentscope-core/src/main/java/io/agentscope/core/ReActAgent.java#L5649" target="_blank">
  <text x="74" y="1288" font-size="18" fill="#6cdbb3" font-weight="600">普通结束与结构化输出</text>
</a>
<text x="74" y="1314" font-size="15" fill="#b1c2d7" font-weight="400">MODEL_STOP：无本地工具且有可见文本</text>
<text x="74" y="1338" font-size="15" fill="#b1c2d7" font-weight="400">服务端工具同消息已带结果时直接完成</text>
<text x="74" y="1362" font-size="15" fill="#b1c2d7" font-weight="400">STRUCTURED_OUTPUT：原生或合成工具降级</text>
<text x="74" y="1386" font-size="15" fill="#b1c2d7" font-weight="400">MAX_ITERATIONS：summarizing 无工具收尾</text>

<rect x="468" y="1260" width="385" height="164" rx="10" fill="#16243a" stroke="#324967"/>
<a xlink:href="https://github.com/agentscope-ai/agentscope-java/blob/80926f92df182d258118456ae458043af0d7e807/agentscope-core/src/main/java/io/agentscope/core/ReActAgent.java#L2698" target="_blank">
